name: Billions Verify
on: [workflow_dispatch, push]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Verify Identity
        run: |
          echo "Verifying Agent..."
          cat identity.json
          echo "Success! Link human to agent: https://billions.network/verify-agent?github=${{ github.repository_owner }}"
